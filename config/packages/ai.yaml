# config/packages/ai.yaml
ai:
    agent:
        default:
            platform: 'ai.platform.anthropic'
            model: 'claude-haiku-4-5-20251001'
            prompt: |
                You are an AI assistant for a blog management system.
#            tools:
#                - 'Symfony\AI\Agent\Bridge\Clock\Clock'
    message_store:
        cache:
            messages:
                service: cache.app

    chat:
        app_chat:
            agent: 'ai.agent.default'
            message_store: 'ai.message_store.cache.messages'
